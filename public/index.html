<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>資料・タスク管理台帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
:root{
  --ground:#f4f6f4; --surface:#ffffff; --surface-2:#f8faf8;
  --ink:#1a211f; --muted:#5f6b66; --faint:#8a938e;
  --line:#e2e7e3; --line-strong:#d3dad5;
  --accent:#107569; --accent-ink:#0b5750; --accent-soft:#e2f1ee;
  --ok:#15803d; --ok-soft:#e5f3ea;
  --warn:#b45309; --warn-soft:#fbf0e0;
  --danger:#c2410c; --danger-soft:#fbe8df;
  --info:#1d6fb8; --info-soft:#e5eff8;
  --shadow:0 1px 2px rgba(20,30,26,.04),0 6px 20px rgba(20,30,26,.06);
  --shadow-lg:0 8px 40px rgba(20,30,26,.18);
  --r:12px; --r-sm:8px;
  --sans:"Noto Sans JP",system-ui,-apple-system,sans-serif;
  --disp:"Zen Kaku Gothic New","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#121615; --surface:#1a201e; --surface-2:#202724;
  --ink:#e9efeb; --muted:#a3ada8; --faint:#79837e;
  --line:#2b332f; --line-strong:#39423d;
  --accent:#2bb3a3; --accent-ink:#5fd3c5; --accent-soft:#173330;
  --ok:#4ade80; --ok-soft:#16281d;
  --warn:#fbbf68; --warn-soft:#2e2413;
  --danger:#fb9a6b; --danger-soft:#2e1c13;
  --info:#6bb6f0; --info-soft:#122334;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  --shadow-lg:0 8px 40px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --ground:#121615; --surface:#1a201e; --surface-2:#202724;
  --ink:#e9efeb; --muted:#a3ada8; --faint:#79837e;
  --line:#2b332f; --line-strong:#39423d;
  --accent:#2bb3a3; --accent-ink:#5fd3c5; --accent-soft:#173330;
  --ok:#4ade80; --ok-soft:#16281d;
  --warn:#fbbf68; --warn-soft:#2e2413;
  --danger:#fb9a6b; --danger-soft:#2e1c13;
  --info:#6bb6f0; --info-soft:#122334;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  --shadow-lg:0 8px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:14px}
img{max-width:100%}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
h1,h2,h3{font-family:var(--disp);margin:0;text-wrap:balance;letter-spacing:.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:20px 20px 14px;display:flex;align-items:center;gap:10px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none}
.brand h1{font-size:15px;line-height:1.25}
.brand .sub{font-size:11px;color:var(--faint);letter-spacing:.04em}
.nav{padding:6px 12px;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:var(--muted);padding:9px 12px;border-radius:var(--r-sm);font-size:13.5px;font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.nav button .ct{margin-left:auto;font-size:11px;color:var(--faint);font-weight:500}
.nav button.on .ct{color:var(--accent-ink)}
.sec-label{padding:16px 20px 6px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--faint);display:flex;align-items:center;justify-content:space-between}
.sec-label button{background:none;border:none;color:var(--accent);font-size:16px;line-height:1;padding:0 4px;border-radius:6px}
.sec-label button:hover{background:var(--accent-soft)}
.cats{padding:0 12px 12px;display:flex;flex-direction:column;gap:1px}
.cat{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;color:var(--muted);padding:7px 12px;border-radius:var(--r-sm);font-size:13px}
.cat:hover{background:var(--surface-2);color:var(--ink)}
.cat.on{background:var(--surface-2);color:var(--ink);font-weight:700}
.cat .dot{width:9px;height:9px;border-radius:3px;flex:none}
.cat .ct{margin-left:auto;font-size:11px;color:var(--faint)}
.cat .del{margin-left:6px;opacity:0;border:none;background:none;color:var(--faint);font-size:14px;line-height:1;padding:2px}
.cat:hover .del{opacity:1}
.cat .del:hover{color:var(--danger)}
.me-box{margin-top:auto;border-top:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.me-box .lbl{font-size:11px;color:var(--faint);letter-spacing:.04em}
.me-box .who{display:flex;align-items:center;gap:8px}
.me-box .who .av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.me-box .who span{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-box .who button{margin-left:auto;background:none;border:none;color:var(--accent);font-size:11px}
.me-box .logout{background:none;border:none;color:var(--faint);font-size:11px;text-align:left;padding:0;margin-top:2px}
.me-box .logout:hover{color:var(--danger)}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar h2{font-size:19px}
.topbar .desc{font-size:12.5px;color:var(--muted);width:100%;margin-top:-6px}
.search{margin-left:auto;position:relative}
.search input{width:230px;max-width:40vw;padding:9px 12px 9px 34px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:9px 15px;border-radius:var(--r-sm);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-ink);color:#fff}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--danger);border-color:transparent}
.btn.danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.content{padding:24px 28px 60px;max-width:1180px;width:100%}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.tile .k{font-size:12px;color:var(--muted);font-weight:500}
.tile .v{font-family:var(--disp);font-size:30px;font-weight:700;line-height:1.1;margin-top:6px}
.tile.alert .v{color:var(--danger)}
.tile.warn .v{color:var(--warn)}
.dash-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.panel h3{font-size:14px;padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.panel h3 .ct{margin-left:auto;font-size:12px;color:var(--faint);font-weight:500}
.panel .body{padding:8px 8px}
.empty{padding:34px 20px;text-align:center;color:var(--faint);font-size:13px}

.trow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r-sm)}
.trow:hover{background:var(--surface-2)}
.trow .tt{font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .meta{font-size:11.5px;color:var(--muted);display:flex;gap:10px;margin-top:2px;flex-wrap:wrap;align-items:center}
.trow .grow{min-width:0;flex:1}
.due{font-weight:700;font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.due.over{color:var(--danger)} .due.soon{color:var(--warn)} .due.ok{color:var(--muted)} .due.done{color:var(--faint)}
.due .flag{width:6px;height:6px;border-radius:50%;background:currentColor}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.st-未着手{background:var(--surface-2);color:var(--muted);border:1px solid var(--line-strong)}
.pill.st-進行中{background:var(--info-soft);color:var(--info)}
.pill.st-完了{background:var(--ok-soft);color:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:500;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip .dot{width:8px;height:8px;border-radius:3px}
.av-mini{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;flex:none}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 17px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s,transform .15s}
.mcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.mcard .top{display:flex;align-items:flex-start;gap:10px}
.mcard h3{font-size:15px;line-height:1.35;flex:1}
.mcard .mdesc{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcard .foot{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--faint);margin-top:auto;flex-wrap:wrap}
.mcard .foot .g{display:inline-flex;align-items:center;gap:4px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;border:1px solid var(--line);background:var(--surface-2)}
.thumb.ic{display:grid;place-items:center;color:var(--muted)}

.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow-x:auto}
table.tasks{width:100%;border-collapse:collapse;min-width:720px}
table.tasks th{text-align:left;font-size:11px;letter-spacing:.05em;color:var(--faint);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
table.tasks th.sortable{cursor:pointer;user-select:none}
table.tasks th.sortable:hover{color:var(--ink)}
table.tasks td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
table.tasks tr:last-child td{border-bottom:none}
table.tasks tbody tr{cursor:pointer}
table.tasks tbody tr:hover{background:var(--surface-2)}
.t-title{font-weight:500}
.t-link{font-size:11px;color:var(--accent-ink);display:inline-flex;align-items:center;gap:4px;margin-top:3px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:none;background:none;padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}

.overlay{position:fixed;inset:0;background:rgba(15,22,20,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px 40px;z-index:50;overflow-y:auto}
.overlay[hidden]{display:none}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;border:1px solid var(--line);animation:pop .18s ease}
.modal.wide{max-width:720px}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:20px 24px 14px;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:18px;flex:1}
.modal-head .x{background:none;border:none;font-size:22px;color:var(--faint);line-height:1;padding:2px 6px;border-radius:6px}
.modal-head .x:hover{background:var(--surface-2);color:var(--ink)}
.modal-body{padding:20px 24px}
.modal-foot{padding:14px 24px 20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink)}
.field textarea{resize:vertical;min-height:80px}
.field .row{display:flex;gap:12px}
.field .row>*{flex:1}
.hint{font-size:11.5px;color:var(--faint);margin-top:5px}
.err{font-size:12.5px;color:var(--danger);margin-top:8px;min-height:1em}

.md-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.md-sec{margin-top:22px}
.md-sec h4{font-size:13px;font-family:var(--disp);margin-bottom:10px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.md-sec h4 .ct{color:var(--faint);font-weight:500;font-size:12px}
.att-list{display:flex;flex-direction:column;gap:8px}
.att{display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2)}
.att .ic{width:36px;height:36px;border-radius:7px;display:grid;place-items:center;flex:none;background:var(--surface);border:1px solid var(--line);color:var(--accent-ink);overflow:hidden}
.att .ic img{width:100%;height:100%;object-fit:cover}
.att .nm{flex:1;min-width:0}
.att .nm a{color:var(--ink);font-weight:500;text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .nm a:hover{color:var(--accent-ink);text-decoration:underline}
.att .nm .sub{font-size:11px;color:var(--faint)}
.att .rm{background:none;border:none;color:var(--faint);font-size:16px;padding:4px}
.att .rm:hover{color:var(--danger)}
.notes{display:flex;flex-direction:column;gap:10px}
.note{display:flex;gap:10px}
.note .av-mini{margin-top:2px}
.note .bub{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;flex:1}
.note .bub .h{font-size:11.5px;color:var(--muted);margin-bottom:2px;display:flex;gap:8px}
.note .bub .h b{color:var(--ink)}
.note .bub .txt{font-size:13px;white-space:pre-wrap;word-break:break-word}
.note-add{display:flex;gap:8px;margin-top:12px}
.note-add textarea{flex:1;min-height:40px;padding:9px 12px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink);resize:vertical}
.drop{border:1.5px dashed var(--line-strong);border-radius:var(--r-sm);padding:16px;text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.mini-task{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2)}
.mini-task .grow{flex:1;min-width:0}
.mini-task .tt{font-size:13px;font-weight:500}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:11px 20px;border-radius:999px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);z-index:80;animation:pop .2s;max-width:90vw}
.toast[hidden]{display:none}
.loading{display:grid;place-items:center;padding:80px 20px;color:var(--faint);gap:14px}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* login */
.login-screen{position:fixed;inset:0;background:var(--ground);display:grid;place-items:center;z-index:100;padding:20px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:34px 32px;width:100%;max-width:380px;text-align:center}
.login-card .logo{width:46px;height:46px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:#fff;margin:0 auto 16px}
.login-card h1{font-size:19px;margin-bottom:4px}
.login-card p{font-size:12.5px;color:var(--muted);margin:0 0 22px}
.login-card input{width:100%;padding:12px 14px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink);text-align:center;margin-bottom:12px}
.login-card .btn{width:100%;justify-content:center}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto}
  .me-box{margin-top:0}
  .tiles{grid-template-columns:1fr 1fr}
  .dash-grid{grid-template-columns:1fr}
  .content{padding:18px 16px 50px}
  .topbar{padding:14px 16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h10l6 6v10H4z"/><path d="M14 4v6h6"/></svg></div>
      <div><h1>資料・タスク管理台帳</h1><div class="sub">社内共有ワークスペース</div></div>
    </div>
    <nav class="nav" id="nav">
      <button data-view="dashboard" class="on"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>ダッシュボード</button>
      <button data-view="materials"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l2-2h5l2 2h7a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7z"/></svg>資料<span class="ct" id="ct-mat"></span></button>
      <button data-view="tasks"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M21 12v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h11"/></svg>タスク<span class="ct" id="ct-task"></span></button>
    </nav>
    <div class="sec-label">カテゴリ・案件 <button id="add-cat" title="カテゴリを追加">＋</button></div>
    <div class="cats" id="cats"></div>
    <div class="me-box">
      <div class="lbl">追記者（あなた）</div>
      <div class="who"><div class="av" id="me-av">?</div><span id="me-name">未設定</span><button id="set-me">変更</button></div>
      <button class="logout" id="logout">ログアウト</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div style="flex:1;min-width:0">
        <h2 id="view-title">ダッシュボード</h2>
        <div class="desc" id="view-desc"></div>
      </div>
      <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="search" type="search" placeholder="検索…"></div>
      <button class="btn pri" id="primary-add">＋ 追加</button>
    </div>
    <div class="content" id="content"><div class="loading"><div class="spin"></div><div>読み込んでいます…</div></div></div>
  </main>
</div>

<div class="login-screen" id="login" hidden>
  <form class="login-card" id="login-form">
    <div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h10l6 6v10H4z"/><path d="M14 4v6h6"/></svg></div>
    <h1>資料・タスク管理台帳</h1>
    <p>社内共有のパスワードを入力してください</p>
    <input type="password" id="login-pw" placeholder="パスワード" autocomplete="current-password" autofocus>
    <button type="submit" class="btn pri" id="login-btn">ログイン</button>
    <div class="err" id="login-err"></div>
  </form>
</div>

<div class="overlay" id="overlay" hidden><div id="modal-root"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const STATUS=["未着手","進行中","完了"];
const PALETTE=["#107569","#1d6fb8","#b45309","#7c3aed","#c2410c","#0891b2","#be185d","#4d7c0f"];
const state={projects:[],materials:[],tasks:[],view:"dashboard",pf:null,q:"",me:localStorage.getItem("kanri_me")||"",
  tSort:"due",tDir:"asc",tStatus:"all",openMat:null,loginMode:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nowISO=()=>new Date().toISOString();
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
function daysUntil(due){const a=new Date(due+"T00:00:00");const b=new Date(todayStr()+"T00:00:00");return Math.round((a-b)/86400000);}
function dueState(due,status){if(!due)return "";if(status==="完了")return "done";const t=todayStr();if(due<t)return "over";return daysUntil(due)<=3?"soon":"ok";}
function fmtDue(due){if(!due)return "期限なし";const d=daysUntil(due);const md=due.slice(5).replace("-","/");if(d<0)return md+"（"+(-d)+"日超過）";if(d===0)return md+"（今日）";if(d===1)return md+"（明日）";if(d<=3)return md+"（あと"+d+"日）";return md;}
function fmtWhen(iso){if(!iso)return "";const d=new Date(iso);const t=todayStr();const ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");const hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");return ds===t?"今日 "+hm:(d.getMonth()+1)+"/"+d.getDate()+" "+hm;}
function initials(n){n=(n||"").trim();if(!n)return "?";return n.slice(0,2);}
function projOf(id){return state.projects.find(p=>p.id===id);}
function projName(id){const p=projOf(id);return p?p.name:"未分類";}
function projColor(id){const p=projOf(id);return p?p.color:"#8a938e";}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2400);}

/* ---------- API ---------- */
async function api(method,path,body,isForm){
  const opts={method,credentials:"same-origin"};
  if(body!==undefined){ if(isForm){opts.body=body;} else {opts.headers={"content-type":"application/json"};opts.body=JSON.stringify(body);} }
  const r=await fetch("/api"+path,opts);
  if(r.status===401){ showLogin(); throw new Error("unauth"); }
  if(!r.ok){ let e=null; try{e=await r.json();}catch{} throw new Error((e&&(e.message||e.error))||("HTTP "+r.status)); }
  const ct=r.headers.get("content-type")||""; return ct.includes("json")?r.json():r.text();
}
async function reload(){
  const s=await api("GET","/state");
  state.projects=(s.projects||[]).sort((a,b)=>(a.order||0)-(b.order||0));
  state.materials=s.materials||[];
  state.tasks=s.tasks||[];
}

/* ---------- boot ---------- */
let pollTimer=null;
(async function boot(){
  bindStatic();renderMe();
  try{ await api("GET","/me"); }catch(e){ return; }  // 401 → showLogin already called
  await afterAuth();
})();
async function afterAuth(){
  $("#login").hidden=true;$("#app").hidden=false;state.loginMode=false;
  try{ await reload(); render(); }catch(e){ if(String(e.message)!=="unauth") toast("読み込みエラー: "+e.message); }
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(async()=>{ try{ await reload(); render(); refreshMat(); }catch(e){} },25000);
}
function showLogin(){
  state.loginMode=true;if(pollTimer)clearInterval(pollTimer);
  $("#app").hidden=true;$("#overlay").hidden=true;$("#login").hidden=false;
  const pw=$("#login-pw");if(pw){pw.value="";setTimeout(()=>pw.focus(),50);}
}

/* ---------- static bindings ---------- */
function bindStatic(){
  $("#nav").addEventListener("click",e=>{const b=e.target.closest("button[data-view]");if(!b)return;setView(b.dataset.view);});
  $("#primary-add").addEventListener("click",()=>{ if(state.view==="materials") openMaterialForm(); else openTaskForm(); });
  $("#add-cat").addEventListener("click",openCatForm);
  $("#set-me").addEventListener("click",promptName);
  $("#logout").addEventListener("click",async()=>{ try{await api("POST","/logout");}catch{} showLogin(); });
  $("#search").addEventListener("input",e=>{state.q=e.target.value.trim();render();});
  $("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal();});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!state.loginMode)closeModal();});
  $("#login-form").addEventListener("submit",doLogin);
}
async function doLogin(e){
  e.preventDefault();
  const pw=$("#login-pw").value;const btn=$("#login-btn");const err=$("#login-err");
  err.textContent="";btn.disabled=true;btn.textContent="確認中…";
  try{
    await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:pw})})
      .then(async r=>{ if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.error==="server_not_configured"?"サーバーにパスワードが未設定です（管理者に連絡してください）":"パスワードが違います"); } });
    await afterAuth();
  }catch(ex){ err.textContent=ex.message; }
  finally{ btn.disabled=false;btn.textContent="ログイン"; }
}
function setView(v){state.view=v;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.view===v));render();}

/* ---------- render ---------- */
function render(){
  if(state.loginMode)return;
  $("#ct-mat").textContent=state.materials.length||"";
  $("#ct-task").textContent=state.tasks.filter(t=>t.status!=="完了").length||"";
  renderCats();
  const titles={dashboard:["ダッシュボード","全体の状況と、対応が必要なタスクをひと目で確認"],
    materials:["資料","写真・PDF・動画・Excel・リンクを案件ごとに整理。閲覧・追記できます"],
    tasks:["タスク","誰が・いつまでに・何を。担当と期限、進捗を一元管理"]};
  $("#view-title").textContent=titles[state.view][0];
  $("#view-desc").textContent=titles[state.view][1];
  $("#primary-add").textContent = state.view==="materials"?"＋ 資料を追加":"＋ タスクを追加";
  const c=$("#content");
  if(state.view==="dashboard") c.innerHTML=viewDashboard();
  else if(state.view==="materials") c.innerHTML=viewMaterials();
  else c.innerHTML=viewTasks();
  wireContent();
}
function renderMe(){$("#me-name").textContent=state.me||"未設定";$("#me-av").textContent=initials(state.me);}
function renderCats(){
  const box=$("#cats");const counts={};state.materials.forEach(m=>{counts[m.projectId]=(counts[m.projectId]||0)+1;});
  let h=`<button class="cat ${state.pf===null?"on":""}" data-pf="__all"><span class="dot" style="background:var(--faint)"></span>すべて<span class="ct">${state.materials.length}</span></button>`;
  state.projects.forEach(p=>{h+=`<button class="cat ${state.pf===p.id?"on":""}" data-pf="${p.id}"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}<span class="ct">${counts[p.id]||0}</span><button class="del" data-delcat="${p.id}" title="削除">×</button></button>`;});
  box.innerHTML=h;
  box.querySelectorAll("[data-pf]").forEach(b=>b.addEventListener("click",e=>{
    if(e.target.dataset.delcat){e.stopPropagation();confirmDelCat(e.target.dataset.delcat);return;}
    state.pf=b.dataset.pf==="__all"?null:b.dataset.pf; if(state.view==="dashboard")setView("materials"); else render();
  }));
}

/* ---------- dashboard ---------- */
function viewDashboard(){
  const open=state.tasks.filter(t=>t.status!=="完了");
  const over=open.filter(t=>t.due&&dueState(t.due,t.status)==="over");
  const soon=open.filter(t=>t.due&&dueState(t.due,t.status)==="soon");
  const prog=state.tasks.filter(t=>t.status==="進行中");
  const attn=[...over,...soon].sort((a,b)=>(a.due||"").localeCompare(b.due||""));
  const recent=[...state.materials].sort((a,b)=>(b.updatedAt||b.createdAt||"").localeCompare(a.updatedAt||a.createdAt||"")).slice(0,6);
  return `
  <div class="tiles">
    <div class="tile"><div class="k">資料</div><div class="v tnum">${state.materials.length}</div></div>
    <div class="tile"><div class="k">未完了タスク</div><div class="v tnum">${open.length}</div></div>
    <div class="tile ${prog.length?"warn":""}"><div class="k">進行中</div><div class="v tnum">${prog.length}</div></div>
    <div class="tile ${over.length?"alert":""}"><div class="k">期限超過</div><div class="v tnum">${over.length}</div></div>
  </div>
  <div class="dash-grid">
    <div class="panel">
      <h3><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>対応が必要なタスク<span class="ct">${attn.length}件</span></h3>
      <div class="body">${attn.length?attn.map(taskRow).join(""):`<div class="empty">期限の近い・超過したタスクはありません 🎉</div>`}</div>
    </div>
    <div class="panel">
      <h3><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"><path d="M3 7l2-2h5l2 2h7v11H3z"/></svg>最近更新された資料<span class="ct">${state.materials.length}件</span></h3>
      <div class="body">${recent.length?recent.map(m=>`
        <div class="trow" data-open-mat="${m.id}">
          <div class="grow"><div class="tt">${esc(m.title)}</div>
          <div class="meta"><span class="chip"><span class="dot" style="background:${projColor(m.projectId)}"></span>${esc(projName(m.projectId))}</span>
          <span>${(m.files||[]).length} 添付</span><span>${(m.notes||[]).length} 追記</span><span>${fmtWhen(m.updatedAt||m.createdAt)}</span></div></div>
        </div>`).join(""):`<div class="empty">資料はまだありません。<br>「資料」タブから追加できます。</div>`}</div>
    </div>
  </div>`;
}
function taskRow(t){
  const ds=dueState(t.due,t.status);const m=t.materialId?state.materials.find(x=>x.id===t.materialId):null;
  return `<div class="trow" data-open-task="${t.id}">
    <div class="grow"><div class="tt">${esc(t.title)}</div>
    <div class="meta"><span class="av-mini">${esc(initials(t.assignee)||"—")}</span>${t.assignee?esc(t.assignee):"担当未定"}
    <span class="chip"><span class="dot" style="background:${projColor(t.projectId)}"></span>${esc(projName(t.projectId))}</span>
    ${m?`<span>🔗 ${esc(m.title)}</span>`:""}</div></div>
    <span class="pill st-${t.status}">${t.status}</span>
    <span class="due ${ds}"><span class="flag"></span>${fmtDue(t.due)}</span>
  </div>`;
}

/* ---------- materials ---------- */
function matchMat(m){if(!state.q)return true;const q=state.q.toLowerCase();return (m.title||"").toLowerCase().includes(q)||(m.desc||"").toLowerCase().includes(q)||(m.notes||[]).some(n=>(n.text||"").toLowerCase().includes(q));}
function viewMaterials(){
  let list=state.materials.filter(m=>state.pf===null||m.projectId===state.pf).filter(matchMat)
    .sort((a,b)=>(b.updatedAt||b.createdAt||"").localeCompare(a.updatedAt||a.createdAt||""));
  if(!list.length) return `<div class="panel"><div class="empty">${state.q?"該当する資料がありません。":"資料がまだありません。<br><br>右上の「＋ 資料を追加」から、写真・PDF・動画・Excel・リンクをまとめて登録できます。"}</div></div>`;
  return `<div class="mgrid">${list.map(matCard).join("")}</div>`;
}
function fileIcon(a){
  if(a.kind==="link")return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>`;
  const t=a.contentType||"";
  if(t.startsWith("video"))return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m23 7-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>`;
  if(t==="application/pdf")return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>`;
  if(t.includes("sheet")||t.includes("excel")||t==="text/csv")return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>`;
  return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>`;
}
function attUrl(a){return a.kind==="link"?a.url:("/file/"+a.id);}
function matCard(m){
  const files=m.files||[];const imgs=files.filter(f=>f.kind==="file"&&(f.contentType||"").startsWith("image")).slice(0,4);
  const tasks=state.tasks.filter(t=>t.materialId===m.id&&t.status!=="完了").length;
  return `<div class="mcard" data-open-mat="${m.id}">
    <div class="top"><h3>${esc(m.title)}</h3></div>
    <span class="chip" style="align-self:flex-start"><span class="dot" style="background:${projColor(m.projectId)}"></span>${esc(projName(m.projectId))}</span>
    ${m.desc?`<div class="mdesc">${esc(m.desc)}</div>`:""}
    ${imgs.length?`<div class="thumbs">${imgs.map(f=>`<img class="thumb" src="${attUrl(f)}" alt="" loading="lazy">`).join("")}${files.length>imgs.length?`<div class="thumb ic">+${files.length-imgs.length}</div>`:""}</div>`:""}
    <div class="foot">
      <span class="g">${fileIcon({kind:"file",contentType:""})}${files.length} 添付</span>
      <span class="g"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>${(m.notes||[]).length} 追記</span>
      ${tasks?`<span class="g" style="color:var(--warn)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11l3 3 8-8"/><path d="M21 12v7H3V5h11"/></svg>タスク${tasks}</span>`:""}
      <span class="g" style="margin-left:auto">${fmtWhen(m.updatedAt||m.createdAt)}</span>
    </div>
  </div>`;
}

/* ---------- tasks ---------- */
function matchTask(t){if(!state.q)return true;const q=state.q.toLowerCase();return (t.title||"").toLowerCase().includes(q)||(t.assignee||"").toLowerCase().includes(q);}
function viewTasks(){
  let list=state.tasks.filter(t=>state.pf===null||t.projectId===state.pf).filter(matchTask)
    .filter(t=>state.tStatus==="all"||t.status===state.tStatus);
  const dir=state.tDir==="asc"?1:-1;
  list.sort((a,b)=>{let x,y;
    if(state.tSort==="due"){x=a.due||"9999";y=b.due||"9999";}
    else if(state.tSort==="status"){x=STATUS.indexOf(a.status);y=STATUS.indexOf(b.status);}
    else if(state.tSort==="assignee"){x=a.assignee||"んんん";y=b.assignee||"んんん";}
    else {x=a.title||"";y=b.title||"";}
    return x<y?-dir:x>y?dir:0;});
  const seg=`<div class="filters">
    <div class="seg" id="st-seg">
      <button data-st="all" class="${state.tStatus==="all"?"on":""}">すべて</button>
      ${STATUS.map(s=>`<button data-st="${s}" class="${state.tStatus===s?"on":""}">${s}</button>`).join("")}
    </div>
    <span style="font-size:12px;color:var(--faint);margin-left:auto">${list.length} 件</span>
  </div>`;
  if(!list.length) return seg+`<div class="panel"><div class="empty">${state.q||state.tStatus!=="all"||state.pf?"該当するタスクがありません。":"タスクがまだありません。<br><br>右上の「＋ タスクを追加」から、担当者・期限・進捗を登録できます。"}</div></div>`;
  const arrow=k=>state.tSort===k?(state.tDir==="asc"?" ▲":" ▼"):"";
  return seg+`<div class="tbl-wrap"><table class="tasks">
    <thead><tr>
      <th class="sortable" data-sort="title">件名${arrow("title")}</th>
      <th class="sortable" data-sort="assignee">担当者${arrow("assignee")}</th>
      <th class="sortable" data-sort="due">期限${arrow("due")}</th>
      <th class="sortable" data-sort="status">状況${arrow("status")}</th>
      <th>カテゴリ</th>
    </tr></thead>
    <tbody>${list.map(taskTr).join("")}</tbody>
  </table></div>`;
}
function taskTr(t){
  const ds=dueState(t.due,t.status);const m=t.materialId?state.materials.find(x=>x.id===t.materialId):null;
  return `<tr data-open-task="${t.id}">
    <td><div class="t-title">${esc(t.title)}</div>${m?`<div class="t-link"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>${esc(m.title)}</div>`:""}</td>
    <td>${t.assignee?`<span style="display:inline-flex;align-items:center;gap:7px"><span class="av-mini">${esc(initials(t.assignee))}</span>${esc(t.assignee)}</span>`:`<span style="color:var(--faint)">未定</span>`}</td>
    <td><span class="due ${ds}"><span class="flag"></span>${fmtDue(t.due)}</span></td>
    <td><span class="pill st-${t.status}">${t.status}</span></td>
    <td><span class="chip"><span class="dot" style="background:${projColor(t.projectId)}"></span>${esc(projName(t.projectId))}</span></td>
  </tr>`;
}

/* ---------- wire content ---------- */
function wireContent(){
  const c=$("#content");
  c.querySelectorAll("[data-open-mat]").forEach(el=>el.addEventListener("click",()=>openMaterial(el.dataset.openMat)));
  c.querySelectorAll("[data-open-task]").forEach(el=>el.addEventListener("click",()=>openTaskForm(el.dataset.openTask)));
  const seg=c.querySelector("#st-seg");if(seg)seg.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{state.tStatus=b.dataset.st;render();}));
  c.querySelectorAll("th.sortable").forEach(th=>th.addEventListener("click",()=>{const k=th.dataset.sort;if(state.tSort===k)state.tDir=state.tDir==="asc"?"desc":"asc";else{state.tSort=k;state.tDir="asc";}render();}));
}

/* ---------- modal core ---------- */
function openModal(html){$("#modal-root").innerHTML=html;$("#overlay").hidden=false;const x=$("#modal-root .x");if(x)x.onclick=closeModal;}
function closeModal(){$("#overlay").hidden=true;$("#modal-root").innerHTML="";state.openMat=null;}
function optProjects(sel){return `<option value="">未分類</option>`+state.projects.map(p=>`<option value="${p.id}" ${sel===p.id?"selected":""}>${esc(p.name)}</option>`).join("");}
function optMaterials(sel){return `<option value="">（なし）</option>`+state.materials.map(m=>`<option value="${m.id}" ${sel===m.id?"selected":""}>${esc(m.title)}</option>`).join("");}
async function ensureMe(){ if(state.me) return true; await promptName(); return !!state.me; }

/* ---------- name ---------- */
function promptName(){
  openModal(`<div class="modal" style="max-width:420px"><div class="modal-head"><h2>お名前を入力</h2><button class="x">×</button></div>
    <div class="modal-body"><div class="field"><label>追記者名（社内で表示されます）</label><input id="f-me" value="${esc(state.me)}" placeholder="例）山崎"></div>
    <div class="hint">タスク作成や資料への追記の際、記録者として表示されます。</div></div>
    <div class="modal-foot"><button class="btn" id="c">キャンセル</button><button class="btn pri" id="s">保存</button></div></div>`);
  const inp=$("#f-me");inp.focus();
  $("#c").onclick=closeModal;
  $("#s").onclick=()=>{const v=inp.value.trim();if(!v){inp.focus();return;}state.me=v;localStorage.setItem("kanri_me",v);renderMe();closeModal();};
  return new Promise(res=>{const iv=setInterval(()=>{if($("#overlay").hidden){clearInterval(iv);res();}},120);});
}

/* ---------- category ---------- */
function openCatForm(){
  openModal(`<div class="modal" style="max-width:440px"><div class="modal-head"><h2>カテゴリ・案件を追加</h2><button class="x">×</button></div>
  <div class="modal-body"><div class="field"><label>名称</label><input id="c-name" placeholder="例）2026春 新商品プロジェクト"></div>
  <div class="field"><label>色</label><div id="c-colors" style="display:flex;gap:8px;flex-wrap:wrap">${PALETTE.map((c,i)=>`<button data-c="${c}" class="cdot" style="width:30px;height:30px;border-radius:8px;background:${c};border:3px solid ${i===0?"var(--ink)":"transparent"}"></button>`).join("")}</div></div></div>
  <div class="modal-foot"><button class="btn" id="c">キャンセル</button><button class="btn pri" id="s">追加</button></div></div>`);
  let color=PALETTE[0];const inp=$("#c-name");inp.focus();
  $("#c-colors").querySelectorAll(".cdot").forEach(b=>b.onclick=()=>{color=b.dataset.c;$("#c-colors").querySelectorAll(".cdot").forEach(x=>x.style.borderColor="transparent");b.style.borderColor="var(--ink)";});
  $("#c").onclick=closeModal;
  $("#s").onclick=async()=>{const n=inp.value.trim();if(!n){inp.focus();return;}
    try{ await api("POST","/projects",{name:n,color}); await reload(); closeModal(); render(); toast("カテゴリを追加しました"); }catch(e){toast("エラー: "+e.message);} };
}
function confirmDelCat(id){
  const p=projOf(id);if(!p)return;const n=state.materials.filter(m=>m.projectId===id).length+state.tasks.filter(t=>t.projectId===id).length;
  openModal(`<div class="modal" style="max-width:420px"><div class="modal-head"><h2>カテゴリを削除</h2><button class="x">×</button></div>
  <div class="modal-body"><p>「${esc(p.name)}」を削除します。${n?`このカテゴリの ${n} 件の資料・タスクは「未分類」になります（データは残ります）。`:""}</p></div>
  <div class="modal-foot"><button class="btn" id="c">キャンセル</button><button class="btn danger" id="s">削除する</button></div></div>`);
  $("#c").onclick=closeModal;
  $("#s").onclick=async()=>{ try{ await api("DELETE","/projects/"+id); if(state.pf===id)state.pf=null; await reload(); closeModal(); render(); toast("削除しました"); }catch(e){toast("エラー: "+e.message);} };
}

/* ---------- task form ---------- */
function openTaskForm(id,presetMat){
  const t=id?state.tasks.find(x=>x.id===id):null;
  openModal(`<div class="modal"><div class="modal-head"><h2>${t?"タスクを編集":"タスクを追加"}</h2><button class="x">×</button></div>
  <div class="modal-body">
    <div class="field"><label>件名 *</label><input id="t-title" value="${t?esc(t.title):""}" placeholder="例）商品パンフレットの初稿を作成"></div>
    <div class="field"><div class="row">
      <div><label>担当者</label><input id="t-assignee" value="${t?esc(t.assignee||""):esc(state.me)}" placeholder="担当者名"></div>
      <div><label>期限</label><input id="t-due" type="date" value="${t?t.due||"":""}"></div>
    </div></div>
    <div class="field"><div class="row">
      <div><label>状況</label><select id="t-status">${STATUS.map(s=>`<option ${((t&&t.status)||"未着手")===s?"selected":""}>${s}</option>`).join("")}</select></div>
      <div><label>カテゴリ・案件</label><select id="t-proj">${optProjects(t?t.projectId:state.pf)}</select></div>
    </div></div>
    <div class="field"><label>紐付ける資料</label><select id="t-mat">${optMaterials(t?t.materialId:presetMat)}</select></div>
    <div class="field"><label>メモ</label><textarea id="t-note" placeholder="補足があれば">${t?esc(t.note||""):""}</textarea></div>
  </div>
  <div class="modal-foot">${t?`<button class="btn danger" id="del" style="margin-right:auto">削除</button>`:""}<button class="btn" id="c">キャンセル</button><button class="btn pri" id="s">保存</button></div></div>`);
  $("#t-title").focus();$("#c").onclick=closeModal;
  if(t)$("#del").onclick=async()=>{if(confirm("このタスクを削除しますか？")){try{await api("DELETE","/tasks/"+t.id);await reload();closeModal();render();refreshMat();toast("削除しました");}catch(e){toast("エラー: "+e.message);}}};
  $("#s").onclick=async()=>{
    const title=$("#t-title").value.trim();if(!title){$("#t-title").focus();return;}
    const v={assignee:$("#t-assignee").value.trim(),due:$("#t-due").value||"",status:$("#t-status").value,
      projectId:$("#t-proj").value||"",materialId:$("#t-mat").value||"",note:$("#t-note").value.trim()};
    if(!await ensureMe())return;
    try{ await api("POST","/tasks",{id:t?t.id:undefined,title,...v,by:state.me}); await reload(); closeModal(); render(); refreshMat(); toast(t?"更新しました":"タスクを追加しました"); }
    catch(e){toast("エラー: "+e.message);}
  };
}

/* ---------- material form ---------- */
function openMaterialForm(id){
  const m=id?state.materials.find(x=>x.id===id):null;
  openModal(`<div class="modal"><div class="modal-head"><h2>${m?"資料の情報を編集":"資料を追加"}</h2><button class="x">×</button></div>
  <div class="modal-body">
    <div class="field"><label>タイトル *</label><input id="m-title" value="${m?esc(m.title):""}" placeholder="例）新商品カタログ 素材一式"></div>
    <div class="field"><label>カテゴリ・案件</label><select id="m-proj">${optProjects(m?m.projectId:state.pf)}</select></div>
    <div class="field"><label>説明</label><textarea id="m-desc" placeholder="内容の概要・メモ">${m?esc(m.desc||""):""}</textarea></div>
    ${!m?`<div class="hint">作成後、詳細画面で写真・PDF・動画・Excel・リンクの添付や、追記ができます。</div>`:""}
  </div>
  <div class="modal-foot"><button class="btn" id="c">キャンセル</button><button class="btn pri" id="s">保存</button></div></div>`);
  $("#m-title").focus();$("#c").onclick=closeModal;
  $("#s").onclick=async()=>{
    const title=$("#m-title").value.trim();if(!title){$("#m-title").focus();return;}
    const pid=$("#m-proj").value||"",desc=$("#m-desc").value.trim();
    if(!await ensureMe())return;
    try{
      const res=await api("POST","/materials",{id:m?m.id:undefined,title,projectId:pid,desc,by:state.me});
      await reload();
      if(m){closeModal();render();toast("更新しました");}
      else{closeModal();setView("materials");toast("資料を追加しました");openMaterial(res.id);}
    }catch(e){toast("エラー: "+e.message);}
  };
}

/* ---------- material detail ---------- */
function openMaterial(id){state.openMat=id;renderMatModal();}
function refreshMat(){if(state.openMat&&!$("#overlay").hidden)renderMatModal(true);}
function curMat(){return state.materials.find(m=>m.id===state.openMat);}
function renderMatModal(keepDraft){
  const m=curMat();if(!m){if(state.openMat)closeModal();return;}
  const draft=keepDraft&&$("#note-input")?$("#note-input").value:"";
  const files=m.files||[],notes=m.notes||[];
  const linked=state.tasks.filter(t=>t.materialId===m.id).sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999"));
  openModal(`<div class="modal wide"><div class="modal-head">
    <div style="flex:1"><span class="chip" style="margin-bottom:8px"><span class="dot" style="background:${projColor(m.projectId)}"></span>${esc(projName(m.projectId))}</span>
    <h2>${esc(m.title)}</h2></div>
    <button class="btn ghost sm" id="m-edit" title="情報を編集"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    <button class="x">×</button></div>
  <div class="modal-body">
    ${m.desc?`<p style="color:var(--muted);margin:0 0 6px;white-space:pre-wrap">${esc(m.desc)}</p>`:""}
    <div class="md-meta"><span style="font-size:11.5px;color:var(--faint)">作成: ${esc(m.createdBy||"—")} ・ ${fmtWhen(m.createdAt)}${m.updatedAt&&m.updatedAt!==m.createdAt?" ／ 更新 "+fmtWhen(m.updatedAt):""}</span>
    <button class="btn danger sm" id="m-del" style="margin-left:auto">資料を削除</button></div>

    <div class="md-sec"><h4>添付ファイル・リンク <span class="ct">${files.length}</span></h4>
      <div class="att-list" id="att-list">${files.length?files.map(attRow).join(""):`<div style="font-size:12.5px;color:var(--faint);padding:2px 0">まだ添付はありません。</div>`}</div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <div class="drop" id="drop" style="flex:1;min-width:180px">クリック / ドラッグで<br><b>写真・動画・PDF・Excel</b> をアップロード（1ファイル25MBまで）</div>
        <button class="btn sm" id="add-link" style="align-self:flex-start">＋ リンクを添付</button>
      </div>
      <div class="hint">25MBを超える大容量動画などは「リンクを添付」で共有ドライブのURLを登録してください。</div>
      <input type="file" id="file-input" multiple hidden>
    </div>

    <div class="md-sec"><h4>関連タスク <span class="ct">${linked.length}</span><button class="btn ghost sm" id="add-task" style="margin-left:auto">＋ タスク</button></h4>
      <div style="display:flex;flex-direction:column;gap:8px">${linked.length?linked.map(t=>{const ds=dueState(t.due,t.status);return `<div class="mini-task" data-task="${t.id}">
        <span class="pill st-${t.status}">${t.status}</span>
        <div class="grow"><div class="tt">${esc(t.title)}</div><div class="meta" style="font-size:11.5px;color:var(--muted)">${t.assignee?esc(t.assignee):"担当未定"} ・ <span class="due ${ds}" style="font-size:11.5px">${fmtDue(t.due)}</span></div></div>
      </div>`;}).join(""):`<div style="font-size:12.5px;color:var(--faint)">この資料に紐づくタスクはありません。</div>`}</div>
    </div>

    <div class="md-sec"><h4>追記・コメント <span class="ct">${notes.length}</span></h4>
      <div class="notes" id="notes">${notes.length?notes.slice().reverse().map(n=>`<div class="note"><span class="av-mini">${esc(initials(n.by))}</span><div class="bub"><div class="h"><b>${esc(n.by||"匿名")}</b><span>${fmtWhen(n.at)}</span></div><div class="txt">${esc(n.text)}</div></div></div>`).join(""):`<div style="font-size:12.5px;color:var(--faint)">まだ追記はありません。気づいた点や進捗を残せます。</div>`}</div>
      <div class="note-add"><textarea id="note-input" placeholder="追記を入力…（社内に共有されます）">${esc(draft)}</textarea><button class="btn pri" id="note-send" style="align-self:stretch">追記</button></div>
    </div>
  </div></div>`);
  $("#m-edit").onclick=()=>openMaterialForm(m.id);
  $("#m-del").onclick=async()=>{if(confirm("この資料と、添付・追記をすべて削除しますか？")){try{await api("DELETE","/materials/"+m.id);await reload();closeModal();render();toast("削除しました");}catch(e){toast("エラー: "+e.message);}}};
  $("#add-task").onclick=()=>openTaskForm(null,m.id);
  $("#modal-root").querySelectorAll("[data-task]").forEach(el=>el.onclick=()=>openTaskForm(el.dataset.task));
  $("#modal-root").querySelectorAll("[data-rm]").forEach(el=>el.onclick=e=>{e.stopPropagation();removeAtt(m.id,el.dataset.rm);});
  $("#add-link").onclick=()=>openLinkForm(m.id);
  $("#note-send").onclick=()=>sendNote(m.id);
  const fi=$("#file-input"),drop=$("#drop");
  drop.onclick=()=>fi.click();
  fi.onchange=()=>{uploadFiles(m.id,[...fi.files]);fi.value="";};
  drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("over");});
  drop.addEventListener("dragleave",()=>drop.classList.remove("over"));
  drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("over");uploadFiles(m.id,[...e.dataTransfer.files]);});
}
function attRow(f){
  const url=attUrl(f);const isImg=f.kind==="file"&&(f.contentType||"").startsWith("image");
  const sub=f.kind==="link"?"リンク":(f.size?humanSize(f.size):"")+(f.by?" ・ "+f.by:"");
  return `<div class="att"><div class="ic">${isImg?`<img src="${url}" alt="" loading="lazy">`:fileIcon(f)}</div>
    <div class="nm"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(f.name)}</a><div class="sub">${esc(sub)}</div></div>
    <button class="rm" data-rm="${f.id}" title="削除">×</button></div>`;
}
function humanSize(b){if(b<1024)return b+"B";if(b<1048576)return (b/1024).toFixed(0)+"KB";return (b/1048576).toFixed(1)+"MB";}

async function uploadFiles(matId,fileList){
  if(!fileList.length)return;if(!await ensureMe())return;
  for(const file of fileList){
    if(file.size>25*1048576){toast("25MBを超えています（"+file.name+"）。リンク添付をご利用ください");continue;}
    toast("アップロード中… "+file.name);
    try{
      const fd=new FormData();fd.append("file",file);fd.append("name",file.name);fd.append("by",state.me);
      if(file.type)fd.append("contentType",file.type);
      await api("POST","/materials/"+matId+"/files",fd,true);
      toast("追加しました: "+file.name);
    }catch(e){toast("アップロード失敗: "+e.message);}
  }
  await reload();render();refreshMat();
}
function openLinkForm(matId){
  openModal(`<div class="modal" style="max-width:460px"><div class="modal-head"><h2>リンクを添付</h2><button class="x">×</button></div>
  <div class="modal-body">
    <div class="field"><label>URL *</label><input id="l-url" placeholder="https://… （Google Drive / SharePoint 等）"></div>
    <div class="field"><label>表示名</label><input id="l-name" placeholder="例）売上集計.xlsx"></div>
    <div class="hint">大容量動画や外部資料は、共有ドライブにアップした上でリンクを貼ると便利です。</div>
  </div>
  <div class="modal-foot"><button class="btn" id="c">キャンセル</button><button class="btn pri" id="s">添付</button></div></div>`);
  $("#l-url").focus();
  $("#c").onclick=()=>{state.openMat=matId;renderMatModal();};
  $("#s").onclick=async()=>{
    let url=$("#l-url").value.trim();if(!url){$("#l-url").focus();return;}
    if(!/^https?:\/\//i.test(url))url="https://"+url;
    const nameIn=$("#l-name").value.trim();
    if(!await ensureMe())return;
    const name=nameIn||url.replace(/^https?:\/\//,"").slice(0,40);
    try{ await api("POST","/materials/"+matId+"/links",{url,name,by:state.me}); await reload(); state.openMat=matId; renderMatModal(); render(); toast("リンクを添付しました"); }
    catch(e){toast("エラー: "+e.message);}
  };
}
async function removeAtt(matId,fileId){
  const m=state.materials.find(x=>x.id===matId);if(!m)return;const f=(m.files||[]).find(x=>x.id===fileId);if(!f)return;
  if(!confirm("「"+f.name+"」を削除しますか？"))return;
  try{ await api("DELETE","/files/"+fileId); await reload(); renderMatModal(); render(); toast("削除しました"); }
  catch(e){toast("エラー: "+e.message);}
}
async function sendNote(matId){
  const inp=$("#note-input");const txt=inp.value.trim();if(!txt)return;
  if(!await ensureMe())return;
  try{ await api("POST","/materials/"+matId+"/notes",{by:state.me,text:txt}); await reload(); state.openMat=matId; renderMatModal(); render(); toast("追記しました"); }
  catch(e){toast("エラー: "+e.message);}
}
</script>
</body>
</html>
