<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MICHASOL 事業管理ワークスペース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Zen+Kaku+Gothic+Antique:wght@700;900&display=swap">
<style>
:root{
  --surface:#ffffff; --surface-2:#faf6ee; --surface-3:#f5efe3;
  --navy:#16273c; --navy-2:#22354e; --navy-line:rgba(255,255,255,.10);
  --ink:#16273c; --body:#5d574b; --muted:#8b8374; --faint:#aca493;
  --line:#e8e0cf; --line-strong:#dccfb6;
  --gold:#bd8b40; --gold-ink:#9a6c26; --gold-soft:#f3e7cd; --gold-bright:#d8b46a;
  --ok:#3f7d54; --ok-soft:#e7f0e8;
  --warn:#b07d2e; --warn-soft:#f6ead1;
  --danger:#b2482f; --danger-soft:#f6e1d9;
  --info:#3a5f86; --info-soft:#e7edf4;
  --shadow:0 1px 2px rgba(40,30,10,.05),0 8px 26px rgba(40,30,10,.07);
  --shadow-lg:0 20px 60px rgba(22,39,60,.28);
  --r:16px; --r-sm:10px; --r-lg:26px;
  --sans:"Noto Sans JP",system-ui,-apple-system,sans-serif;
  --disp:"Zen Kaku Gothic New","Noto Sans JP",system-ui,sans-serif;
  --disp-heavy:"Zen Kaku Gothic Antique","Zen Kaku Gothic New","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--body);font-family:var(--sans);line-height:1.7;font-size:14px;
  background:linear-gradient(140deg,#f5efe3 0%,#efe6d4 55%,#ece0cb 100%);background-attachment:fixed;min-height:100vh}
img{max-width:100%}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
h1,h2,h3,h4{font-family:var(--disp);margin:0;color:var(--ink);text-wrap:balance;letter-spacing:.01em}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--gold-ink);text-transform:uppercase}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.side{background:var(--navy);color:#cfd6e0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:24px 22px 18px;display:flex;align-items:center;gap:12px}
.brand .logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(150deg,#d8b46a,#bd8b40);display:grid;place-items:center;color:#16273c;flex:none;font-family:var(--disp-heavy);font-weight:900;font-size:22px;box-shadow:0 6px 16px rgba(189,139,64,.35)}
.brand .bt .eb{font-size:9.5px;font-weight:700;letter-spacing:.16em;color:var(--gold-bright);text-transform:uppercase}
.brand .bt h1{font-size:15px;line-height:1.3;color:#fff;font-family:var(--disp);font-weight:700;margin-top:2px}
.nav{padding:10px 14px;display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;color:#aeb6c2;padding:10px 13px;border-radius:11px;font-size:13.5px;font-weight:500;position:relative}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:rgba(216,180,106,.14);color:var(--gold-bright);font-weight:700}
.nav button.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--gold-bright)}
.nav button .ct{margin-left:auto;font-size:11px;color:#7f889a;font-weight:600}
.nav button.on .ct{color:var(--gold-bright)}
.sec-label{padding:20px 22px 8px;font-size:10.5px;font-weight:700;letter-spacing:.14em;color:#7f889a;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}
.sec-label button{background:none;border:none;color:var(--gold-bright);font-size:17px;line-height:1;padding:0 4px;border-radius:6px}
.sec-label button:hover{background:rgba(255,255,255,.08)}
.cats{padding:0 14px 12px;display:flex;flex-direction:column;gap:1px}
.cat{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:#aeb6c2;padding:8px 13px;border-radius:10px;font-size:13px}
.cat:hover{background:rgba(255,255,255,.06);color:#fff}
.cat.on{background:rgba(255,255,255,.09);color:#fff;font-weight:700}
.cat .dot{width:9px;height:9px;border-radius:3px;flex:none}
.cat .ct{margin-left:auto;font-size:11px;color:#7f889a}
.cat .del{margin-left:6px;opacity:0;border:none;background:none;color:#7f889a;font-size:15px;line-height:1;padding:2px}
.cat:hover .del{opacity:1}
.cat .del:hover{color:var(--danger)}
.me-box{margin-top:auto;border-top:1px solid var(--navy-line);padding:16px 18px;display:flex;flex-direction:column;gap:7px}
.me-box .lbl{font-size:10px;color:#7f889a;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.me-box .who{display:flex;align-items:center;gap:9px}
.me-box .who .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(150deg,#d8b46a,#bd8b40);color:#16273c;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.me-box .who span{font-size:13px;font-weight:500;color:#e6e9ee;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-box .who button{margin-left:auto;background:none;border:none;color:var(--gold-bright);font-size:11px}
.me-box .logout{background:none;border:none;color:#7f889a;font-size:11px;text-align:left;padding:0}
.me-box .logout:hover{color:#e6a08a}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:5;background:rgba(245,239,227,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:18px 30px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar .tt-eb{font-size:10.5px;font-weight:700;letter-spacing:.16em;color:var(--gold-ink);text-transform:uppercase}
.topbar h2{font-size:21px;font-weight:700;line-height:1.2;margin-top:1px}
.topbar .desc{font-size:12.5px;color:var(--muted);width:100%}
.search{margin-left:auto;position:relative}
.search input{width:240px;max-width:42vw;padding:10px 14px 10px 36px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:var(--r-sm);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--gold);color:var(--gold-ink)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:#0f1d30;color:#fff}
.btn.gold{background:linear-gradient(150deg,#d8b46a,#bd8b40);border:none;color:#16273c}
.btn.gold:hover{filter:brightness(1.05);color:#16273c}
.btn.sm{padding:7px 12px;font-size:12px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:rgba(22,39,60,.05);color:var(--ink)}
.btn.danger{color:var(--danger);border-color:transparent}
.btn.danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.content{padding:26px 30px 64px;max-width:1200px;width:100%}

/* ---------- dashboard ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;right:-16px;top:-16px;width:60px;height:60px;border-radius:50%;background:var(--surface-3);opacity:.7}
.tile .k{font-size:12px;color:var(--muted);font-weight:600;position:relative}
.tile .v{font-family:var(--disp-heavy);font-size:34px;font-weight:900;line-height:1;margin-top:8px;color:var(--ink);position:relative}
.tile.alert .v{color:var(--danger)} .tile.warn .v{color:var(--gold-ink)}
.dash-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.panel h3{font-size:14px;font-weight:700;padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.panel h3 .ct{margin-left:auto;font-size:12px;color:var(--faint);font-weight:600}
.panel .body{padding:9px 9px}
.empty{padding:38px 20px;text-align:center;color:var(--faint);font-size:13px}

.trow{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:var(--r-sm)}
.trow:hover{background:var(--surface-2)}
.trow .tt{font-weight:500;font-size:13.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .meta{font-size:11.5px;color:var(--muted);display:flex;gap:10px;margin-top:2px;flex-wrap:wrap;align-items:center}
.trow .grow{min-width:0;flex:1}
.due{font-weight:700;font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.due.over{color:var(--danger)} .due.soon{color:var(--warn)} .due.ok{color:var(--muted)} .due.done{color:var(--faint)}
.due .flag{width:6px;height:6px;border-radius:50%;background:currentColor}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.st-未着手{background:var(--surface-3);color:var(--muted);border:1px solid var(--line-strong)}
.pill.st-進行中{background:var(--info-soft);color:var(--info)}
.pill.st-完了{background:var(--ok-soft);color:var(--ok)}
.pri-dot{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
.pri-最優先{background:var(--danger)} .pri-高{background:var(--gold)} .pri-通常{background:var(--faint)} .pri-低{background:#c9c2b1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:500;background:var(--surface-3);color:var(--muted);border:1px solid var(--line)}
.chip .dot{width:8px;height:8px;border-radius:3px}
.av-mini{width:22px;height:22px;border-radius:50%;background:var(--gold-soft);color:var(--gold-ink);display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;flex:none}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:18px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 19px;display:flex;flex-direction:column;gap:11px;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
.mcard:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 14px 34px rgba(40,30,10,.12)}
.mcard h3{font-size:15.5px;line-height:1.35;font-weight:700}
.mcard .mdesc{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcard .foot{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--faint);margin-top:auto;flex-wrap:wrap}
.mcard .foot .g{display:inline-flex;align-items:center;gap:4px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:var(--surface-2)}
.thumb.ic{display:grid;place-items:center;color:var(--muted)}

.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow-x:auto}
table.tasks{width:100%;border-collapse:collapse;min-width:760px}
table.tasks th{text-align:left;font-size:10.5px;letter-spacing:.06em;color:var(--faint);font-weight:700;padding:13px 15px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);text-transform:uppercase}
table.tasks th.sortable{cursor:pointer;user-select:none}
table.tasks th.sortable:hover{color:var(--ink)}
table.tasks td{padding:13px 15px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
table.tasks tr:last-child td{border-bottom:none}
table.tasks tbody tr{cursor:pointer}
table.tasks tbody tr:hover{background:var(--surface-2)}
.t-title{font-weight:500;color:var(--ink);display:flex;align-items:center;gap:8px}
.t-link{font-size:11px;color:var(--gold-ink);display:inline-flex;align-items:center;gap:4px;margin-top:3px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:none;background:none;padding:7px 15px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff;font-weight:700}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(22,39,60,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 40px;z-index:70;overflow-y:auto}
.overlay[hidden]{display:none}
.modal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;border:1px solid var(--line);animation:pop .18s ease}
.modal.wide{max-width:740px}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:22px 26px 15px;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:18px;font-weight:700;flex:1}
.modal-head .x{background:none;border:none;font-size:23px;color:var(--faint);line-height:1;padding:2px 6px;border-radius:6px}
.modal-head .x:hover{background:var(--surface-2);color:var(--ink)}
.modal-body{padding:22px 26px}
.modal-foot{padding:15px 26px 22px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- fields ---------- */
.field{margin-bottom:18px}
.field>label,.flabel{display:flex;align-items:center;font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:8px}
.flabel .req{color:var(--gold-ink);margin-left:4px}
.flabel .opt{margin-left:auto;font-size:11px;font-weight:500;color:var(--faint);letter-spacing:.02em}
.field input,.field select,.field textarea,.fs-field input,.fs-field select,.fs-field textarea{
  width:100%;padding:12px 14px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink);transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus,.fs-field input:focus,.fs-field select:focus,.fs-field textarea:focus{
  border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(189,139,64,.14);outline:none}
.field textarea,.fs-field textarea{resize:vertical;min-height:84px;line-height:1.7}
.field .row{display:flex;gap:12px}
.field .row>*{flex:1}
.hint{font-size:11.5px;color:var(--faint);margin-top:6px}
.err{font-size:12.5px;color:var(--danger);margin-top:8px;min-height:1em}

/* ---------- full-screen form ---------- */
.formscreen{position:fixed;inset:0;z-index:60;overflow-y:auto;
  background:linear-gradient(140deg,#f5efe3 0%,#efe6d4 55%,#ece0cb 100%)}
.formscreen[hidden]{display:none}
.fs-header{display:flex;align-items:center;gap:14px;padding:22px 40px 0}
.fs-header .logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(150deg,#d8b46a,#bd8b40);display:grid;place-items:center;color:#16273c;font-family:var(--disp-heavy);font-weight:900;font-size:22px;flex:none;box-shadow:0 6px 16px rgba(189,139,64,.3)}
.fs-header .eb{font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--gold-ink);text-transform:uppercase}
.fs-header h1{font-size:16px;font-weight:700;line-height:1.3;margin-top:1px}
.fs-header .sp{margin-left:auto}
.fs-header .cancel{background:none;border:none;color:var(--muted);font-size:13.5px;font-weight:500;padding:8px 10px;border-radius:8px}
.fs-header .cancel:hover{background:rgba(22,39,60,.05);color:var(--ink)}
.fs-header .av{width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;margin-left:6px}
.fs-crumb{padding:22px 40px 0;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fs-crumb .sep{color:var(--faint)}
.fs-crumb .cur{color:var(--ink);font-weight:700}
.fs-wrap{padding:20px 40px 60px}
.fs-card{max-width:1180px;margin:0 auto;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);overflow:hidden;display:grid;grid-template-columns:.82fr 1.18fr;min-height:520px}
.fs-left{background:var(--navy);color:#cfd6e0;padding:44px 40px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.fs-left::before{content:"";position:absolute;right:-70px;top:60px;width:230px;height:230px;border-radius:50%;border:1px solid rgba(255,255,255,.06)}
.fs-left::after{content:"";position:absolute;right:-120px;top:20px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(216,180,106,.12),transparent 70%)}
.fs-left .tag{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;letter-spacing:.16em;color:var(--gold-bright);text-transform:uppercase;position:relative}
.fs-left .tag .d{width:7px;height:7px;border-radius:50%;background:var(--gold-bright)}
.fs-left h2{font-family:var(--disp-heavy);font-weight:900;font-size:38px;line-height:1.28;color:#fff;margin-top:22px;letter-spacing:.02em;position:relative}
.fs-left p{font-size:13px;line-height:1.9;color:#a9b1bd;margin-top:20px;max-width:30ch;position:relative}
.fs-left .foot{margin-top:auto;font-size:11.5px;color:#6f7889;position:relative;padding-top:24px}
.fs-right{padding:44px 46px;position:relative}
.fs-right .plus{position:absolute;right:40px;top:40px;width:46px;height:46px;border-radius:14px;background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center;font-size:24px;font-weight:300}
.fs-right .eb{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--gold-ink);text-transform:uppercase}
.fs-right h2{font-size:30px;font-weight:900;font-family:var(--disp-heavy);line-height:1.2;margin-top:8px}
.fs-right .sub{font-size:13px;color:var(--muted);margin-top:8px;margin-bottom:30px}
.fs-field{margin-bottom:22px}
.fs-row{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.fs-foot{display:flex;gap:12px;align-items:center;margin-top:30px;padding-top:24px;border-top:1px solid var(--line)}
.fs-foot .spacer{flex:1}

/* ---------- material detail sections ---------- */
.md-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.md-sec{margin-top:24px}
.md-sec h4{font-size:13px;margin-bottom:11px;display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:700}
.md-sec h4 .ct{color:var(--faint);font-weight:600;font-size:12px}
.att-list{display:flex;flex-direction:column;gap:8px}
.att{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2)}
.att .ic{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;flex:none;background:#fff;border:1px solid var(--line);color:var(--gold-ink);overflow:hidden}
.att .ic img{width:100%;height:100%;object-fit:cover}
.att .nm{flex:1;min-width:0}
.att .nm a{color:var(--ink);font-weight:500;text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .nm a:hover{color:var(--gold-ink);text-decoration:underline}
.att .nm .sub{font-size:11px;color:var(--faint)}
.att .rm{background:none;border:none;color:var(--faint);font-size:17px;padding:4px}
.att .rm:hover{color:var(--danger)}
.notes{display:flex;flex-direction:column;gap:10px}
.note{display:flex;gap:10px}
.note .av-mini{margin-top:2px}
.note .bub{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 13px;flex:1}
.note .bub .h{font-size:11.5px;color:var(--muted);margin-bottom:2px;display:flex;gap:8px}
.note .bub .h b{color:var(--ink)}
.note .bub .txt{font-size:13px;white-space:pre-wrap;word-break:break-word}
.note-add{display:flex;gap:8px;margin-top:12px}
.note-add textarea{flex:1;min-height:42px;padding:10px 13px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink);resize:vertical}
.drop{border:1.5px dashed var(--line-strong);border-radius:var(--r-sm);padding:17px;text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-ink)}
.mini-task{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2)}
.mini-task .grow{flex:1;min-width:0}
.mini-task .tt{font-size:13px;font-weight:500;color:var(--ink)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--navy);color:#f4efe6;padding:12px 22px;border-radius:999px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);z-index:90;animation:pop .2s;max-width:90vw}
.toast[hidden]{display:none}
.loading{display:grid;place-items:center;padding:90px 20px;color:var(--faint);gap:14px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* R&D */
.rnd-badge{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 9px;border-radius:9px;background:var(--navy);color:var(--cream,#f4efe6);font-family:var(--disp);font-weight:700;font-size:13px;flex:none}
.stars{display:inline-flex;gap:1px;color:var(--gold);font-size:14px;letter-spacing:1px}
.stars .off{color:var(--line-strong)}
.ing-line{font-size:12.5px;color:var(--body);line-height:1.7}
.ing-tag{display:inline-block;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 8px;margin:0 4px 4px 0;font-size:12px}
.ing-tag b{font-variant-numeric:tabular-nums}
.hyd{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--gold-ink);background:var(--gold-soft);border:1px solid #e6d3a8;padding:2px 9px;border-radius:999px}
.trial{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.trial+.trial{margin-top:12px}
.trial-h{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.trial-h .meta{font-size:11.5px;color:var(--muted);margin-left:auto;text-align:right}
.trial-b{padding:13px 15px;display:flex;flex-direction:column;gap:11px}
.trial-b .lab{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.04em;margin-bottom:3px}
.trial-b .val{font-size:13px;white-space:pre-wrap;word-break:break-word;color:var(--body)}
.trial-photos{display:flex;gap:7px;flex-wrap:wrap}
.trial-photos .tp{position:relative}
.trial-photos img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.trial-photos .tp .rm{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;border:2px solid var(--surface);font-size:12px;line-height:1;display:grid;place-items:center;cursor:pointer}
.trial-acts{display:flex;gap:6px;margin-left:auto}
.ing-row{display:grid;grid-template-columns:1fr 88px 70px 32px;gap:8px;margin-bottom:8px;align-items:center}
.ing-row input{padding:9px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2);color:var(--ink);width:100%}
.ing-row .del{border:none;background:none;color:var(--faint);font-size:17px;cursor:pointer;border-radius:6px}
.ing-row .del:hover{color:var(--danger)}
.rate-pick{display:inline-flex;gap:4px;font-size:26px;color:var(--line-strong);cursor:pointer}
.rate-pick .s{transition:transform .1s}
.rate-pick .s.on{color:var(--gold)}
.rate-pick .s:hover{transform:scale(1.15)}
@media (max-width:760px){.ing-row{grid-template-columns:1fr 70px 56px 28px;gap:6px}}

/* ---------- login ---------- */
.login-screen{position:fixed;inset:0;display:grid;place-items:center;z-index:100;padding:20px;
  background:linear-gradient(140deg,#f5efe3,#ece0cb)}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);padding:40px 36px;width:100%;max-width:390px;text-align:center}
.login-card .logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(150deg,#d8b46a,#bd8b40);display:grid;place-items:center;color:#16273c;margin:0 auto 18px;font-family:var(--disp-heavy);font-weight:900;font-size:28px;box-shadow:0 8px 20px rgba(189,139,64,.3)}
.login-card .eb{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--gold-ink);text-transform:uppercase}
.login-card h1{font-size:20px;font-weight:700;margin:4px 0 4px}
.login-card p{font-size:12.5px;color:var(--muted);margin:0 0 24px}
.login-card input{width:100%;padding:13px 15px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink);text-align:center;margin-bottom:12px}
.login-card input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(189,139,64,.14)}
.login-card .btn{width:100%;justify-content:center}

/* mobile drawer chrome (hidden on desktop) */
.hamburger{display:none;place-items:center;width:42px;height:42px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);flex:none}
.hamburger:hover{border-color:var(--gold);color:var(--gold-ink)}
#scrim{position:fixed;inset:0;background:rgba(22,39,60,.45);z-index:110}
#scrim[hidden]{display:none}

/* tablet */
@media (max-width:1000px){
  .app{grid-template-columns:220px 1fr}
  .tiles{grid-template-columns:1fr 1fr}
  .dash-grid{grid-template-columns:1fr}
}
/* phone */
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:0;left:0;height:100dvh;width:min(286px,86vw);transform:translateX(-100%);transition:transform .25s ease;z-index:120;box-shadow:var(--shadow-lg)}
  .side.open{transform:translateX(0)}
  .hamburger{display:inline-grid}
  .topbar{padding:13px 16px;gap:12px;align-items:center}
  .topbar h2{font-size:18px}
  .topbar .tt-eb{display:none}
  .topbar .desc{display:none}
  .search{order:3;width:100%;margin-left:0}
  .search input{width:100%;max-width:none}
  #primary-add{margin-left:auto}
  .content{padding:18px 15px 72px}
  .tiles{gap:12px}
  .tile{padding:15px 16px}
  .tile .v{font-size:28px}
  .mgrid{grid-template-columns:1fr;gap:14px}
  .modal{border-radius:16px}
  .modal-body,.modal-head{padding-left:18px;padding-right:18px}
  .overlay{padding:3vh 10px 30px}
  .fs-header{padding:16px 16px 0}
  .fs-header h1{font-size:14px}
  .fs-header .av{width:36px;height:36px}
  .fs-crumb{padding:16px 16px 0;font-size:12px}
  .fs-wrap{padding:16px 14px 50px}
  .fs-card{grid-template-columns:1fr;border-radius:20px;min-height:0}
  .fs-left{padding:28px 24px}
  .fs-left h2{font-size:27px}
  .fs-left p{max-width:none}
  .fs-left::before,.fs-left::after{display:none}
  .fs-right{padding:28px 22px}
  .fs-right .plus{display:none}
  .fs-right h2{font-size:25px}
  .fs-row{grid-template-columns:1fr;gap:0}
  .fs-foot{flex-wrap:wrap}
  .fs-foot .btn{flex:1;justify-content:center}
}
@media (max-width:400px){
  .tiles{grid-template-columns:1fr 1fr;gap:10px}
  .tile .v{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand">
      <div class="logo">蕎</div>
      <div class="bt"><div class="eb">MICHASOL SOBAPROJECT</div><h1>事業管理ワークスペース</h1></div>
    </div>
    <nav class="nav" id="nav">
      <button data-view="dashboard" class="on"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>ダッシュボード</button>
      <button data-view="materials"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l2-2h5l2 2h7a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7z"/></svg>資料<span class="ct" id="ct-mat"></span></button>
      <button data-view="tasks"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M21 12v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h11"/></svg>タスク<span class="ct" id="ct-task"></span></button>
      <button data-view="rnd"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 8a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-8V3"/><path d="M7.5 14h9"/></svg>研究・開発<span class="ct" id="ct-rnd"></span></button>
    </nav>
    <div class="sec-label">カテゴリ・案件 <button id="add-cat" title="カテゴリを追加">＋</button></div>
    <div class="cats" id="cats"></div>
    <div class="me-box">
      <div class="lbl">担当メンバー</div>
      <div class="who"><div class="av" id="me-av">?</div><span id="me-name">未設定</span><button id="set-me">変更</button></div>
      <button class="logout" id="logout">ログアウト</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="hamburger" id="hamburger" aria-label="メニューを開く"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div style="flex:1;min-width:0">
        <div class="tt-eb" id="view-eb">DASHBOARD</div>
        <h2 id="view-title">ダッシュボード</h2>
        <div class="desc" id="view-desc"></div>
      </div>
      <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="search" type="search" placeholder="検索…"></div>
      <button class="btn pri" id="primary-add">＋ 追加</button>
    </div>
    <div class="content" id="content"><div class="loading"><div class="spin"></div><div>読み込んでいます…</div></div></div>
  </main>
</div>

<div class="formscreen" id="formscreen" hidden></div>

<div class="login-screen" id="login" hidden>
  <form class="login-card" id="login-form">
    <div class="logo">蕎</div>
    <div class="eb">MICHASOL SOBAPROJECT</div>
    <h1>事業管理ワークスペース</h1>
    <p>社内共有のパスワードを入力してください</p>
    <input type="password" id="login-pw" placeholder="パスワード" autocomplete="current-password" autofocus>
    <button type="submit" class="btn pri" id="login-btn">ログイン</button>
    <div class="err" id="login-err"></div>
  </form>
</div>

<div id="scrim" hidden></div>
<div class="overlay" id="overlay" hidden><div id="modal-root"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const STATUS=["未着手","進行中","完了"];
const PRIORITIES=["低","通常","高","最優先"];
const PALETTE=["#bd8b40","#3a5f86","#3f7d54","#7c5cbf","#b2482f","#0e7c86","#b8407a","#5f7a2e"];
const state={projects:[],materials:[],tasks:[],rnd:[],view:"dashboard",pf:null,q:"",me:localStorage.getItem("kanri_me")||"",
  tSort:"due",tDir:"asc",tStatus:"all",openMat:null,openTheme:null,loginMode:false,formOpen:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nowISO=()=>new Date().toISOString();
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
function daysUntil(due){const a=new Date(due+"T00:00:00");const b=new Date(todayStr()+"T00:00:00");return Math.round((a-b)/86400000);}
function dueState(due,status){if(!due)return "";if(status==="完了")return "done";const t=todayStr();if(due<t)return "over";return daysUntil(due)<=3?"soon":"ok";}
function fmtDue(due){if(!due)return "期限なし";const d=daysUntil(due);const md=due.slice(5).replace("-","/");if(d<0)return md+"（"+(-d)+"日超過）";if(d===0)return md+"（今日）";if(d===1)return md+"（明日）";if(d<=3)return md+"（あと"+d+"日）";return md;}
function fmtWhen(iso){if(!iso)return "";const d=new Date(iso);const t=todayStr();const ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");const hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");return ds===t?"今日 "+hm:(d.getMonth()+1)+"/"+d.getDate()+" "+hm;}
function initials(n){n=(n||"").trim();if(!n)return "?";return n.slice(0,2);}
function projOf(id){return state.projects.find(p=>p.id===id);}
function projName(id){const p=projOf(id);return p?p.name:"未分類";}
function projColor(id){const p=projOf(id);return p?p.color:"#aca493";}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2400);}

/* ---------- API ---------- */
async function api(method,path,body,isForm){
  const opts={method,credentials:"same-origin"};
  if(body!==undefined){ if(isForm){opts.body=body;} else {opts.headers={"content-type":"application/json"};opts.body=JSON.stringify(body);} }
  const r=await fetch("/api"+path,opts);
  if(r.status===401){ showLogin(); throw new Error("unauth"); }
  if(!r.ok){ let e=null; try{e=await r.json();}catch{} throw new Error((e&&(e.message||e.error))||("HTTP "+r.status)); }
  const ct=r.headers.get("content-type")||""; return ct.includes("json")?r.json():r.text();
}
async function reload(){
  const s=await api("GET","/state");
  state.projects=(s.projects||[]).sort((a,b)=>(a.order||0)-(b.order||0));
  state.materials=s.materials||[];
  state.tasks=s.tasks||[];
  state.rnd=s.rnd||[];
}

/* ---------- boot ---------- */
let pollTimer=null;
(async function boot(){
  bindStatic();renderMe();
  try{ await api("GET","/me"); }catch(e){ return; }
  await afterAuth();
})();
async function afterAuth(){
  $("#login").hidden=true;$("#app").hidden=false;state.loginMode=false;
  try{ await reload(); render(); }catch(e){ if(String(e.message)!=="unauth") toast("読み込みエラー: "+e.message); }
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(async()=>{ try{ await reload(); render(); refreshMat(); refreshTheme(); }catch(e){} },25000);
}
function showLogin(){
  state.loginMode=true;if(pollTimer)clearInterval(pollTimer);
  $("#app").hidden=true;$("#overlay").hidden=true;$("#formscreen").hidden=true;$("#login").hidden=false;
  const pw=$("#login-pw");if(pw){pw.value="";setTimeout(()=>pw.focus(),50);}
}

/* ---------- static bindings ---------- */
function bindStatic(){
  $("#nav").addEventListener("click",e=>{const b=e.target.closest("button[data-view]");if(!b)return;setView(b.dataset.view);});
  $("#primary-add").addEventListener("click",()=>{ if(state.view==="materials") openMaterialForm(); else if(state.view==="rnd") openThemeForm(); else openTaskForm(); });
  $("#add-cat").addEventListener("click",openCatForm);
  $("#set-me").addEventListener("click",promptName);
  $("#logout").addEventListener("click",async()=>{ try{await api("POST","/logout");}catch{} showLogin(); });
  $("#search").addEventListener("input",e=>{state.q=e.target.value.trim();render();});
  $("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal();});
  $("#hamburger").addEventListener("click",openDrawer);
  $("#scrim").addEventListener("click",closeDrawer);
  document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(state.formOpen)closeForm();else if(!$("#overlay").hidden)closeModal();else closeDrawer();}});
  $("#login-form").addEventListener("submit",doLogin);
}
async function doLogin(e){
  e.preventDefault();
  const pw=$("#login-pw").value;const btn=$("#login-btn");const err=$("#login-err");
  err.textContent="";btn.disabled=true;btn.textContent="確認中…";
  try{
    await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:pw})})
      .then(async r=>{ if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.error==="server_not_configured"?"サーバーにパスワードが未設定です（管理者に連絡してください）":"パスワードが違います"); } });
    await afterAuth();
  }catch(ex){ err.textContent=ex.message; }
  finally{ btn.disabled=false;btn.textContent="ログイン"; }
}
function setView(v){state.view=v;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.view===v));closeDrawer();render();}
function openDrawer(){document.querySelector(".side").classList.add("open");$("#scrim").hidden=false;}
function closeDrawer(){const s=document.querySelector(".side");if(s)s.classList.remove("open");$("#scrim").hidden=true;}

/* ---------- render ---------- */
function render(){
  if(state.loginMode)return;
  $("#ct-mat").textContent=state.materials.length||"";
  $("#ct-task").textContent=state.tasks.filter(t=>t.status!=="完了").length||"";
  $("#ct-rnd").textContent=state.rnd.length||"";
  renderCats();
  const meta={dashboard:["DASHBOARD","ダッシュボード","全体の状況と、対応が必要なタスクをひと目で確認"],
    materials:["DOCUMENT LIBRARY","資料","写真・PDF・動画・Excel・リンクを案件ごとに整理。閲覧・追記できます"],
    tasks:["TASK MANAGEMENT","タスク","誰が・いつまでに・何を。担当と期限、進捗を一元管理"],
    rnd:["RESEARCH & DEVELOPMENT","そば研究・開発","テーマごとに試作を記録。配合・工程・評価を回ごとに残して改良を積み重ねる"]};
  $("#view-eb").textContent=meta[state.view][0];
  $("#view-title").textContent=meta[state.view][1];
  $("#view-desc").textContent=meta[state.view][2];
  $("#primary-add").textContent = state.view==="materials"?"＋ 資料を追加":state.view==="rnd"?"＋ 研究テーマを追加":"＋ タスクを追加";
  const c=$("#content");
  if(state.view==="dashboard") c.innerHTML=viewDashboard();
  else if(state.view==="materials") c.innerHTML=viewMaterials();
  else if(state.view==="rnd") c.innerHTML=viewRnd();
  else c.innerHTML=viewTasks();
  wireContent();
}
function renderMe(){$("#me-name").textContent=state.me||"未設定";$("#me-av").textContent=initials(state.me);}
function renderCats(){
  const box=$("#cats");const counts={};state.materials.forEach(m=>{counts[m.projectId]=(counts[m.projectId]||0)+1;});
  let h=`<button class="cat ${state.pf===null?"on":""}" data-pf="__all"><span class="dot" style="background:#7f889a"></span>すべて<span class="ct">${state.materials.length}</span></button>`;
  state.projects.forEach(p=>{h+=`<button class="cat ${state.pf===p.id?"on":""}" data-pf="${p.id}"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}<span class="ct">${counts[p.id]||0}</span><button class="del" data-delcat="${p.id}" title="削除">×</button></button>`;});
  box.innerHTML=h;
  box.querySelectorAll("[data-pf]").forEach(b=>b.addEventListener("click",e=>{
    if(e.target.dataset.delcat){e.stopPropagation();confirmDelCat(e.target.dataset.delcat);return;}
    state.pf=b.dataset.pf==="__all"?null:b.dataset.pf; closeDrawer(); if(state.view==="dashboard")setView("materials"); else render();
  }));
}

/* ---------- dashboard ---------- */
function viewDashboard(){
  const open=state.tasks.filter(t=>t.status!=="完了");
  const over=open.filter(t=>t.due&&dueState(t.due,t.status)==="over");
  const soon=open.filter(t=>t.due&&dueState(t.due,t.status)==="soon");
  const prog=state.tasks.filter(t=>t.status==="進行中");
  const attn=[...over,...soon].sort((a,b)=>(a.due||"").localeCompare(b.due||""));
  const recent=[...state.materials].sort((a,b)=>(b.updatedAt||b.createdAt||"").localeCompare(a.updatedAt||a.createdAt||"")).slice(0,6);
  return `
  <div class="tiles">
    <div class="tile"><div class="k">資料</div><div class="v tnum">${state.materials.length}</div></div>
    <div class="tile"><div class="k">未完了タスク</div><div class="v tnum">${open.length}</div></div>
    <div class="tile ${prog.length?"warn":""}"><div class="k">進行中</div><div class="v tnum">${prog.length}</div></div>

function taskRow(t){

/* ---------- materials ---------- */
function matchMat(m){if(!state.q)return true;const q=state.q.toLowerCase();return (m.title||"").toLowerCase().includes(q)||(m.desc||"").toLowerCase().includes(q)||(m.notes||[]).some(n=>(n.text||"").toLowerCase().includes(q));}
function viewMaterials(){
  let list=state.materials.filter(m=>state.pf===null||m.projectId===state.pf).filter(matchMat)
    .sort((a,b)=>(b.updatedAt||b.createdAt||"").localeCompare(a.updatedAt||a.createdAt||""));
  if(!list.length) return `<div class="panel"><div class="empty">${state.q?"該当する資料がありません。":"資料がまだありません。<br><br>右上の「＋ 資料を追加」から、写真・PDF・動画・Excel・リンクをまとめて登録できます。"}</div></div>`;
  return `<div class="mgrid">${list.map(matCard).join("")}</div>`;
}
function fileIcon(a){
  if(a.kind==="link")return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>`;
  const t=a.contentType||"";
  if(t.startsWith("video"))return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m23 7-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>`;
  if(t==="application/pdf")return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>`;
  if(t.includes("sheet")||t.includes("excel")||t==="text/csv")return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>`;
  return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>`;
}
function attUrl(a){return a.kind==="link"?a.url:("/file/"+a.id);}
function matCard(m){
  const files=m.files||[];const imgs=files.filter(f=>f.kind==="file"&&(f.contentType||"").startsWith("image")).slice(0,4);
  const tasks=state.tasks.filter(t=>t.materialId===m.id&&t.status!=="完了").length;
  return `<div class="mcard" data-open-mat="${m.id}">
    <h3>${esc(m.title)}</h3>
    <span class="chip" style="align-self:flex-start"><span class="dot" style="background:${projColor(m.projectId)}"></span>${esc(projName(m.projectId))}</span>
    ${m.desc?`<div class="mdesc">${esc(m.desc)}</div>`:""}
    ${imgs.length?`<div class="thumbs">${imgs.map(f=>`<img class="thumb" src="${attUrl(f)}" alt="" loading="lazy">`).join("")}${files.length>imgs.length?`<div class="thumb ic">+${files.length-imgs.length}</div>`:""}</div>`:""}
    <div class="foot">
      <span class="g">${fileIcon({kind:"file",contentType:""})}${files.length} 添付</span>
      <span class="g"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>${(m.notes||[]).length} 追記</span>
      ${tasks?`<span class="g" style="color:var(--warn)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11l3 3 8-8"/><path d="M21 12v7H3V5h11"/></svg>タスク${tasks}</span>`:""}
      <span class="g" style="margin-left:auto">${fmtWhen(m.updatedAt||m.createdAt)}</span>
    </div>
  </div>`;
}

/* ---------- tasks ---------- */
function matchTask(t){if(!state.q)return true;const q=state.q.toLowerCase();return (t.title||"").toLowerCase().includes(q)||(t.assignee||"").toLowerCase().includes(q);}
function viewTasks(){
  let list=state.tasks.filter(t=>state.pf===null||t.projectId===state.pf).filter(matchTask)
    .filter(t=>state.tStatus==="all"||t.status===state.tStatus);
  const dir=state.tDir==="asc"?1:-1;
  const priRank={"最優先":0,"高":1,"通常":2,"低":3};
  list.sort((a,b)=>{let x,y;
    if(state.tSort==="due"){x=a.due||"9999";y=b.due||"9999";}
    else if(state.tSort==="status"){x=STATUS.indexOf(a.status);y=STATUS.indexOf(b.status);}
    else if(state.tSort==="priority"){x=priRank[a.priority||"通常"];y=priRank[b.priority||"通常"];}
    else if(state.tSort==="assignee"){x=a.assignee||"んんん";y=b.assignee||"んんん";}
    else {x=a.title||"";y=b.title||"";}
    return x<y?-dir:x>y?dir:0;});
  const seg=`<div class="filters">
    <div class="seg" id="st-seg">
      <button data-st="all" class="${state.tStatus==="all"?"on":""}">すべて</button>
      ${STATUS.map(s=>`<button data-st="${s}" class="${state.tStatus===s?"on":""}">${s}</button>`).join("")}
    </div>
    <span style="font-size:12px;color:var(--faint);margin-left:auto">${list.length} 件</span>
  </div>`;
  if(!list.length) return seg+`<div class="panel"><div class="empty">${state.q||state.tStatus!=="all"||state.pf?"該当するタスクがありません。":"タスクがまだありません。<br><br>右上の「＋ タスクを追加」から、担当者・期限・進捗を登録できます。"}</div></div>`;
  const arrow=k=>state.tSort===k?(state.tDir==="asc"?" ▲":" ▼"):"";
  return seg+`<div class="tbl-wrap"><table class="tasks">
    <thead><tr>
      <th class="sortable" data-sort="priority">優先${arrow("priority")}</th>
      <th class="sortable" data-sort="title">件名${arrow("title")}</th>
      <th class="sortable" data-sort="assignee">担当者${arrow("assignee")}</th>
      <th class="sortable" data-sort="due">期限${arrow("due")}</th>
      <th class="sortable" data-sort="status">状況${arrow("status")}</th>
      <th>カテゴリ</th>
    </tr></thead>
    <tbody>${list.map(taskTr).join("")}</tbody>
  </table></div>`;
}
function taskTr(t){
  const ds=dueState(t.due,t.status);const m=t.materialId?state.materials.find(x=>x.id===t.materialId):null;
  return `<tr data-open-task="${t.id}">
    <td><span class="pri-dot pri-${t.priority||"通常"}" title="${t.priority||"通常"}"></span></td>
    <td><div class="t-title">${esc(t.title)}</div>${m?`<div class="t-link"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>${esc(m.title)}</div>`:""}</td>
    <td>${t.assignee?`<span style="display:inline-flex;align-items:center;gap:7px"><span class="av-mini">${esc(initials(t.assignee))}</span>${esc(t.assignee)}</span>`:`<span style="color:var(--faint)">未定</span>`}</td>
    <td><span class="due ${ds}"><span class="flag"></span>${fmtDue(t.due)}</span></td>
    <td><span class="pill st-${t.status}">${t.status}</span></td>
    <td><span class="chip"><span class="dot" style="background:${projColor(t.projectId)}"></span>${esc(projName(t.projectId))}</span></td>
  </tr>`;
}

/* ---------- wire content ---------- */
function wireContent(){
  const c=$("#content");
  c.querySelectorAll("[data-open-mat]").forEach(el=>el.addEventListener("click",()=>openMaterial(el.dataset.openMat)));
  c.querySelectorAll("[data-open-task]").forEach(el=>el.addEventListener("click",()=>openTaskForm(el.dataset.openTask)));
  c.querySelectorAll("[data-open-theme]").forEach(el=>el.addEventListener("click",()=>openTheme(el.dataset.openTheme)));
  const seg=c.querySelector("#st-seg");if(seg)seg.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{state.tStatus=b.dataset.st;render();}));
  c.querySelectorAll("th.sortable").forEach(th=>th.addEventListener("click",()=>{const k=th.dataset.sort;if(state.tSort===k)state.tDir=state.tDir==="asc"?"desc":"asc";else{state.tSort=k;state.tDir="asc";}render();}));
}

function openModal(html){closeDrawer();$("#modal-root").innerHTML=html;$("#overlay").hidden=false;const x=$("#modal-root .x");if(x)x.onclick=closeModal;}

function optMaterials(sel){return `<option value="">（なし）</option>`+state.materials.map(m=>`<option value="${m.id}" ${sel===m.id?"selected":""}>${esc(m.title)}</option>`).join("");}
async function ensureMe(){ if(state.me) return true; await promptName(); return !!state.me; }

function attRow(f){
  const url=attUrl(f);const isImg=f.kind==="file"&&(f.contentType||"").startsWith("image");

    <button class="rm" data-rm="${f.id}" title="削除">×</button></div>`;
}
function humanSize(b){if(b<1024)return b+"B";if(b<1048576)return (b/1024).toFixed(0)+"KB";return (b/1048576).toFixed(1)+"MB";}

async function uploadFiles(matId,fileList){
  if(!fileList.length)return;if(!await ensureMe())return;
  for(const file of fileList){
    if(file.size>25*1048576){toast("25MBを超えています（"+file.name+"）。リンク添付をご利用ください");continue;}
    toast("アップロード中… "+file.name);
    try{
      const fd=new FormData();fd.append("file",file);fd.append("name",file.name);fd.append("by",state.me);
      if(file.type)fd.append("contentType",file.type);
      await api("POST","/materials/"+matId+"/files",fd,true);
      toast("追加しました: "+file.name);
    }catch(e){toast("アップロード失敗: "+e.message);}
  }

}

function ingSummary(ings){ return (ings||[]).filter(i=>i.name).map(i=>`${i.name}${i.amount!==""&&i.amount!=null?" "+i.amount+(i.unit||""):""}`).join("・"); }
function hydration(ings){
  let flour=0, water=0;
  (ings||[]).forEach(i=>{const a=parseFloat(i.amount);if(isNaN(a))return;
    if((i.name||"").includes("粉"))flour+=a; if((i.name||"").includes("水"))water+=a;});
  if(flour>0&&water>0)return Math.round(water/flour*100);
  return null;
}
function stars(n){n=Math.max(0,Math.min(5,n||0));let h="";for(let i=1;i<=5;i++)h+=`<span class="${i<=n?"":"off"}">★</span>`;return `<span class="stars">${h}</span>`;}

function viewRnd(){

function openTrialForm(themeId,trialId){

  const tr=trialId?(th.trials||[]).find(x=>x.id===trialId):null;

  if(tr) ings=(tr.ingredients||[]).map(i=>({...i}));
  else{ const last=(th.trials||[]).slice().sort((a,b)=>b.seq-a.seq)[0];
    ings = last&&last.ingredients&&last.ingredients.length ? last.ingredients.map(i=>({...i}))
      : [{name:"蕎麦粉",amount:"",unit:"g"},{name:"水",amount:"",unit:"ml"},{name:"そば皮",amount:"",unit:"g"}]; }

  let rating=tr?tr.rating||0:0;
  const seq=tr?tr.seq:((th.trials||[]).reduce((m,x)=>Math.max(m,x.seq),0)+1);
  openModal(`<div class="modal wide"><div class="modal-head"><div style="flex:1"><div class="eb" style="color:var(--gold-ink);font-size:11px;font-weight:700;letter-spacing:.08em">${esc(th.name)}</div><h2>${tr?tr.seq+"回目を編集":seq+"回目を記録"}</h2></div><button class="x">×</button></div>
  <div class="modal-body">
    <div class="field"><label>配合（材料と分量）</label><div id="ing-list">${ings.map(ingRowHtml).join("")}</div>
      <button class="btn sm" id="add-ing" style="margin-top:2px">＋ 材料を追加</button>
      <div class="hint" id="hyd-live"></div>
    </div>
    <div class="field"><label>工程・作り方 <span style="color:var(--faint);font-weight:400">任意</span></label><textarea id="tr-method" placeholder="こね方・加水の順番・茹で時間など">${tr?esc(tr.method||""):""}</textarea></div>
    <div class="field"><label>結果・所感 <span style="color:var(--faint);font-weight:400">任意</span></label><textarea id="tr-result" placeholder="食感・風味・のど越し・課題・次への改善点など">${tr?esc(tr.result||""):""}</textarea></div>
    <div class="field"><label>総合評価</label><div class="rate-pick" id="rate">${[1,2,3,4,5].map(n=>`<span class="s ${n<=rating?"on":""}" data-n="${n}">★</span>`).join("")}</div></div>
  </div>
  <div class="modal-foot"><button class="btn" id="c">キャンセル</button><button class="btn pri" id="s">${tr?"更新":"記録する"}</button></div></div>`);
  const list=$("#ing-list");
  function updHyd(){const cur=collectIngs();const h=hydration(cur);$("#hyd-live").innerHTML=h!=null?`加水率（水 ÷ 粉）＝ <b style="color:var(--gold-ink)">${h}%</b>`:"※ 「◯◯粉」と「水」を入力すると加水率を自動計算します";}
  function wireRows(){list.querySelectorAll(".del").forEach(b=>b.onclick=()=>{if(list.querySelectorAll(".ing-row").length>1)b.closest(".ing-row").remove();else b.closest(".ing-row").querySelectorAll("input").forEach(i=>i.value="");updHyd();});
    list.querySelectorAll("input").forEach(i=>i.oninput=updHyd);}
  function collectIngs(){return [...list.querySelectorAll(".ing-row")].map(r=>({name:r.querySelector(".ing-name").value.trim(),amount:r.querySelector(".ing-amt").value.trim(),unit:r.querySelector(".ing-unit").value.trim()})).filter(i=>i.name||i.amount);}
  wireRows();updHyd();
  $("#add-ing").onclick=()=>{list.insertAdjacentHTML("beforeend",ingRowHtml({name:"",amount:"",unit:""}));wireRows();};
  $("#rate").querySelectorAll(".s").forEach(s=>s.onclick=()=>{rating=+s.dataset.n===rating?0:+s.dataset.n;$("#rate").querySelectorAll(".s").forEach(x=>x.classList.toggle("on",+x.dataset.n<=rating));});
  $("#c").onclick=()=>{state.openTheme=themeId;renderThemeModal();};
  $("#s").onclick=async()=>{
    const payload={ingredients:collectIngs(),method:$("#tr-method").value.trim(),result:$("#tr-result").value.trim(),rating,by:state.me};
    if(!await ensureMe())return;payload.by=state.me;
    try{
      if(tr) await api("POST","/rnd/trials/"+tr.id,payload);
      else await api("POST","/rnd/themes/"+themeId+"/trials",payload);
      await reload();state.openTheme=themeId;renderThemeModal();render();toast(tr?"更新しました":"試作を記録しました");
    }catch(e){toast("エラー: "+e.message);}
  };
}
async function delTrial(trialId){
  if(!confirm("この試作記録を削除しますか？"))return;
  try{ await api("DELETE","/rnd/trials/"+trialId); await reload(); renderThemeModal(); render(); toast("削除しました"); }
  catch(e){toast("エラー: "+e.message);}
}
async function uploadTrialPhotos(trialId,files){
  if(!files.length)return;if(!await ensureMe())return;
  for(const file of files){
    if(!(file.type||"").startsWith("image")){toast("画像を選んでください");continue;}
    if(file.size>25*1048576){toast("25MBを超えています");continue;}
    toast("アップロード中…");
    try{const fd=new FormData();fd.append("file",file);fd.append("name",file.name);fd.append("by",state.me);if(file.type)fd.append("contentType",file.type);
      await api("POST","/rnd/trials/"+trialId+"/files",fd,true);}catch(e){toast("失敗: "+e.message);}
  }
  await reload();renderThemeModal();toast("写真を追加しました");
}
async function removeTrialPhoto(fileId){
  if(!confirm("この写真を削除しますか？"))return;
  try{ await api("DELETE","/files/"+fileId); await reload(); renderThemeModal(); toast("削除しました"); }
  catch(e){toast("エラー: "+e.message);}
}
</script>
</body>
</html>
